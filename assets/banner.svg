<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow and Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb1 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
      50% { transform: translate(40px, -20px) scale(1.15); opacity: 0.65; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.35; }
      50% { transform: translate(-30px, 30px) scale(1.2); opacity: 0.55; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes radarPing {
      0% { r: 4px; opacity: 0.9; }
      100% { r: 18px; opacity: 0; }
    }

    .orb-1 { animation: pulseOrb1 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 320px; }
    .stream-line { stroke-dasharray: 6 6; animation: dashFlow 2s linear infinite; }
    .pill-1 { animation: floatPill1 4s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 5s ease-in-out infinite; }
    .ping-circle { animation: radarPing 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Ambient Orbs (Background only) -->
  <g class="orb-1">
    <circle cx="220" cy="90" r="150" fill="url(#glowCyan)" />
  </g>
  <g class="orb-2">
    <circle cx="980" cy="300" r="170" fill="url(#glowPurple)" />
  </g>

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Animated Data Stream Lines (Kept to margins/bottom, away from title) -->
  <path d="M 50 380 L 350 380 L 410 350 L 790 350 L 850 380 L 1150 380" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.45" class="stream-line" />
  <path d="M 50 40 L 280 40 L 330 70 L 870 70 L 920 40 L 1150 40" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.35" class="stream-line" />

  <!-- Animated Pulse Radar Nodes at Side Margins -->
  <g transform="translate(80, 210)">
    <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    <circle cx="0" cy="0" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5" class="ping-circle" />
  </g>
  <g transform="translate(1120, 210)">
    <circle cx="0" cy="0" r="4" fill="#c084fc" />
    <circle cx="0" cy="0" r="4" fill="none" stroke="#c084fc" stroke-width="1.5" class="ping-circle" />
  </g>

  <!-- FOREGROUND: Content Card & Title Layer (Guaranteed Foreground Clarity) -->
  <g filter="url(#shadow)">
    <!-- Top Pill Tag -->
    <g class="pill-1" transform="translate(435, 42)">
      <rect width="330" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="20" cy="17" r="4.5" fill="#38bdf8" />
      <text x="34" y="22" fill="#e2e8f0" font-size="12" class="font-mono" letter-spacing="1.5">DEVELOPER PLATFORMS &amp; SDKs</text>
    </g>

    <!-- Main Title Heading (Foreground) -->
    <text x="600" y="148" text-anchor="middle" fill="#ffffff" font-size="44" class="font-title" letter-spacing="-0.5">
      Awesome Developer Platform &amp; SDKs
    </text>

    <!-- Gradient Accent Subtitle (Foreground) -->
    <text x="600" y="196" text-anchor="middle" fill="url(#accentGrad)" font-size="22" class="font-sub" letter-spacing="0.2">
      API Gateways • SDK Generation • Developer Portals • DevEx Tooling
    </text>

    <!-- Subtitle Description Tagline -->
    <text x="600" y="234" text-anchor="middle" fill="#94a3b8" font-size="15" class="font-sub">
      A curated ecosystem of enterprise SaaS platforms and battle-tested open-source projects
    </text>

    <!-- Feature Architecture Pills (Decorated Below Title) -->
    <g transform="translate(160, 276)">
      <!-- Pill 1: SDK Generators -->
      <g class="pill-1" transform="translate(0, 0)">
        <rect width="200" height="46" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" filter="url(#badgeShadow)" />
        <text x="18" y="28" fill="#38bdf8" font-size="16">⚙️</text>
        <text x="44" y="28" fill="#f1f5f9" font-size="13" class="font-title">SDK Generators</text>
      </g>

      <!-- Pill 2: API Gateways -->
      <g class="pill-2" transform="translate(225, 0)">
        <rect width="200" height="46" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" />
        <text x="18" y="28" fill="#818cf8" font-size="16">🌐</text>
        <text x="44" y="28" fill="#f1f5f9" font-size="13" class="font-title">API Gateways</text>
      </g>

      <!-- Pill 3: Dev Portals -->
      <g class="pill-1" transform="translate(450, 0)">
        <rect width="200" height="46" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1" />
        <text x="18" y="28" fill="#a855f7" font-size="16">📚</text>
        <text x="44" y="28" fill="#f1f5f9" font-size="13" class="font-title">Developer Portals</text>
      </g>

      <!-- Pill 4: API Clients & Mocking -->
      <g class="pill-2" transform="translate(675, 0)">
        <rect width="205" height="46" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" />
        <text x="18" y="28" fill="#38bdf8" font-size="16">🧪</text>
        <text x="44" y="28" fill="#f1f5f9" font-size="13" class="font-title">Testing &amp; Clients</text>
      </g>
    </g>

    <!-- Bottom Tech Specs Mini Indicators -->
    <g transform="translate(360, 355)" opacity="0.9">
      <text x="0" y="0" fill="#64748b" font-size="12" class="font-mono">OpenAPI 3.1</text>
      <circle cx="90" cy="-4" r="2.5" fill="#38bdf8" />
      <text x="105" y="0" fill="#64748b" font-size="12" class="font-mono">TypeScript / Python / Go</text>
      <circle cx="280" cy="-4" r="2.5" fill="#818cf8" />
      <text x="295" y="0" fill="#64748b" font-size="12" class="font-mono">REST • GraphQL • MCP</text>
      <circle cx="455" cy="-4" r="2.5" fill="#c084fc" />
      <text x="470" y="0" fill="#64748b" font-size="12" class="font-mono">Production Ready</text>
    </g>
  </g>
</svg>
